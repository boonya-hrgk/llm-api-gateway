<section id="view-chat" class="view" hidden>
  <div class="chat-wrap">
    <div class="chat-side">
      <div class="card">
        <div class="card-head"><h3>设置</h3></div>
        <div class="form-rows">
          <label class="field"><span>API Key 来源</span>
            <select id="chat-key-mode">
              <option value="select">从列表选择</option>
              <option value="manual">手动输入</option>
            </select>
          </label>
          <div id="chat-key-select-wrap">
            <label class="field"><span>选择密钥</span>
              <select id="chat-key">
                <option value="">请选择密钥</option>
              </select>
              <div id="chat-key-error" class="field-error" hidden></div>
            </label>
          </div>
          <div id="chat-key-manual-wrap" hidden>
            <label class="field"><span>手动输入 Key</span>
              <input type="password" id="chat-key-manual" placeholder="sk-xxxx" />
            </label>
          </div>
          <label class="field"><span>模型</span>
            <div class="model-picker" id="model-picker">
              <input type="text" id="chat-model"
                placeholder="点击下拉选择，或直接输入模型名" autocomplete="off" spellcheck="false" />
              <button type="button" class="model-picker-caret" id="chat-model-caret"
                title="选择模型" aria-label="选择模型"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
              <div class="model-menu" id="chat-model-menu" hidden></div>
            </div>
          </label>
          <label class="field"><span>Temperature</span>
            <input type="number" id="chat-temp" value="0.7" step="0.1" min="0" max="2" />
          </label>
          <label class="check-row"><input type="checkbox" id="chat-stream" checked /> 流式输出</label>
          <label class="check-row"><input type="checkbox" id="chat-raw" /> 显示原始响应</label>
          <button class="btn btn-ghost btn-block" id="chat-clear-ctx">清空对话</button>
        </div>
      </div>
    </div>
    <div class="chat-main card">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-msg chat-msg-system">
          <div class="chat-bubble">选择密钥和模型后开始对话吧～</div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <textarea id="chat-input" class="chat-input" rows="2" placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）"></textarea>
        <button class="btn btn-primary" id="chat-send">发送</button>
      </div>
    </div>
  </div>
</section>
