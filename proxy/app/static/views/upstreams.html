<section id="view-upstreams" class="view" hidden>
  <div class="card">
    <div class="card-head">
      <h3>上游列表</h3>
      <button class="btn btn-primary" id="create-upstream-btn">+ 添加上游</button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>ID</th><th>名称</th><th>地址</th><th>协议</th><th>模型</th><th>默认</th><th>Token 采集</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="upstreams-tbody"><tr><td colspan="9" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

<!-- 新建/编辑上游模态框 -->
<div id="modal-upstream" class="modal" hidden>
  <div class="modal-mask"></div>
  <div class="modal-card">
    <div class="card-head"><h3 id="upstream-modal-title">添加上游</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="upstream-edit-id" />
      <label class="field"><span>名称</span>
        <input type="text" id="upstream-name" placeholder="如：vLLM 本地服务" />
      </label>
      <label class="field"><span>基础地址</span>
        <input type="text" id="upstream-base-url" placeholder="如：http://127.0.0.1:8000" />
        <span class="field-hint">OpenAI 上游填根地址（如 http://host:port）；Anthropic 上游填兼容端点（如 https://api.deepseek.com/anthropic）</span>
      </label>
      <label class="field"><span>协议类型</span>
        <select id="upstream-protocol">
          <option value="openai">OpenAI（Chat Completions）</option>
          <option value="anthropic">Anthropic（Messages API）</option>
        </select>
        <span class="field-hint">网关自动识别客户端方言并翻译，上游只需标注它说的是哪种协议</span>
      </label>
      <label class="field"><span>可用模型（可选，一行一个）</span>
        <textarea id="upstream-models" rows="4"
          placeholder="如：&#10;deepseek-chat&#10;deepseek-reasoner&#10;gpt-4o&#10;&#10;一行一个模型名，留空表示不限制/未配置"></textarea>
        <span class="field-hint">在对话测试页会作为模型下拉候选；留空则只能手动输入</span>
      </label>
      <label class="field"><span>上游 API Key（可选）</span>
        <input type="text" id="upstream-api-key" placeholder="如为空则不设置 Authorization 头" />
      </label>
      <label class="check-row">
        <input type="checkbox" id="upstream-is-default" /> 设为默认上游
      </label>
      <label class="check-row">
        <input type="checkbox" id="upstream-inject-usage" /> 流式自动补 include_usage
      </label>
      <div class="field-hint" style="margin-top:-6px">OpenAI 方言流式请求自动补 <code>stream_options.include_usage</code>，让 Ollama / vLLM 等上游在流末尾上报 token 用量。非流式不受影响；Anthropic 上游忽略此项。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="upstream-submit">确定</button>
    </div>
  </div>
</div>
