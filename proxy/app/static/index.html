<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Gateway 授权管理系统</title>
  <link rel="stylesheet" href="/styles.css?v=20260904g" />
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-dot"></span>
        <h1>LLM API Gateway</h1>
      </div>
      <p class="login-sub">大模型API网关系统</p>
      <form id="login-form" class="login-form">
        <label class="field">
          <span>用户名</span>
          <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p id="login-error" class="login-error" hidden></p>
      </form>
      <p class="login-tip">登录信息仅保存在当前浏览器会话中。</p>
    </div>
  </div>

  <!-- 主应用（视图片段按需加载到 #view-root） -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="logo-dot"></span>
        <span>AI Gateway</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item" data-view="overview">系统概览</a>
        <a href="#" class="nav-item" data-view="stats">用量统计</a>
        <a href="#" class="nav-item" data-view="keys">密钥管理</a>
        <a href="#" class="nav-item admin-only" data-view="upstreams">上游管理</a>
        <a href="#" class="nav-item admin-only" data-view="users">用户管理</a>
        <a href="#" class="nav-item" data-view="chat">对话测试</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-info">
          <span class="user-avatar" id="user-avatar">A</span>
          <div>
            <div class="user-name" id="user-name">—</div>
            <div class="user-role" id="user-role">—</div>
          </div>
        </div>
        <button id="logout-btn" class="nav-item nav-logout">退出登录</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h2 id="page-title">概览</h2>
        <div class="topbar-actions">
          <button id="clear-cache-btn" class="btn btn-ghost btn-sm" title="清除浏览器缓存并刷新页面">清缓存</button>
          <button id="theme-toggle" class="icon-btn" title="切换主题">🌙</button>
        </div>
      </header>
      <!-- 各视图 HTML 片段按需挂载于此 -->
      <div id="view-root"></div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Markdown 渲染 / 代码高亮 / HTML 净化（本地化，离线可用） -->
  <script src="/vendor/marked.min.js?v=20260903q"></script>
  <script src="/vendor/highlight.min.js?v=20260903q"></script>
  <script src="/vendor/purify.min.js?v=20260903q"></script>
  <script type="module" src="/js/main.js?v=20260904j"></script>
</body>
</html>
